version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    # Routine version updates must be reviewed; avoid automatic major upgrades.
    # Dependabot SECURITY updates still run regardless of update-types.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3
    # Routine version updates must be reviewed; avoid automatic major upgrades.
    # Dependabot SECURITY updates still run regardless of update-types.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
