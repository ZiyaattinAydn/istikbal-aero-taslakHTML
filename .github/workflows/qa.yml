name: Migration QA
on:
  push:
    branches: [feat/nextjs-react-typescript]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: migration-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:legacy
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: .next
          include-hidden-files: true
          retention-days: 3
  browser:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [production, dev]
    env:
      TEST_SERVER_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.mode == 'production'
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.mode }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
