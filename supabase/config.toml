project_id = "istikbal-aerospace-cms"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./page-seed.sql", "./seed.sql", "./local-admin.sql"]
[studio]
enabled = false
[realtime]
enabled = false
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "5MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 900
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 300
[auth.email.template.magic_link]
subject = "İstikbal Aerospace giriş kodunuz"
content_path = "./supabase/templates/otp.html"
[auth.rate_limit]
email_sent = 20
sign_in_sign_ups = 10
token_verifications = 10
[auth.mfa]
max_enrolled_factors = 2
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[auth.sms]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
